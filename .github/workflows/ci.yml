name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            adapters/*/go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Test with race detector
        run: make test-race

      - name: Vet
        run: make vet

      - name: Check vulnerabilities
        run: make vuln

  postgres-e2e:
    name: Postgres E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: canopy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canopy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANOPY_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            adapters/*/go.sum

      - name: Run Postgres E2E tests
        run: make test-e2e
